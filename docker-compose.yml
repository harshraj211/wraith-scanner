version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wraith_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: wraith_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: gunicorn -w 4 -b 0.0.0.0:5000 api_server:app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://wraith_admin:super_secret_password@db:5432/wraith_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A scanner.core.worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://wraith_admin:super_secret_password@db:5432/wraith_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
